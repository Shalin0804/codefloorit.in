<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:site_name" content="Codefloor IT" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo-->
    <title>Codefloor IT — Custom Software &amp; Web Development Company</title>

    <link rel="canonical" href="https://www.codefloorit.in/" />

    <script type="application/ld+json">

          {

            "@id": "https://www.codefloorit.in/#organization",

            "email": "info@codefloorit.in",
            "telephone": "+917698475791",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Ahmedabad",
              "addressRegion": "Gujarat",
              "addressCountry": "IN"
            },
            "image": "https://www.codefloorit.in/og.png",
            "areaServed": [
              { "@type": "City", "name": "Ahmedabad" },
              { "@type": "State", "name": "Gujarat" },
              { "@type": "Country", "name": "India" }
            ],
            "hasOfferCatalog": {

                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "E-commerce Development", "url": "https://www.codefloorit.in/services/ecommerce-development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Modernization", "url": "https://www.codefloorit.in/services/website-modernization" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Maintenance & Technical Support", "url": "https://www.codefloorit.in/services/maintenance-technical-support" } }
              ]
            },
            "description": "Web and software development company in Ahmedabad, Gujarat, building custom software, web applications, business websites and e-commerce experiences.",
            "knowsAbout": [
              "Custom software development",
              "Web application development",
              "Business website development",
              "E-commerce development",
              "Website modernization",
              "Website maintenance and technical support"
            ],
            "sameAs": [
              "https://www.linkedin.com/company/codefloorit",
              "https://www.instagram.com/codefloorit/",
              "https://www.facebook.com/CodeFloorit/"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "email": "info@codefloorit.in",
              "telephone": "+917698475791"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.codefloorit.in/#website",
            "url": "https://www.codefloorit.in/",
            "name": "Codefloor IT",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://www.codefloorit.in/#organization" }
          }
        ]
      }
